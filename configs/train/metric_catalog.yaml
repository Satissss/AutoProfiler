# =============================================================================
# Controlled vocabulary of VALID NCU (Nsight Compute) section counters.
# REWRITE + ATTRIBUTION may ONLY add/name metrics from this catalog — this is
# what stops an LLM from inventing counter names (e.g. the non-existent
# "l2__throughput.*"; the real L2 unit is exposed as "lts__").
#
# Organized by the standard Nsight Compute analysis sections. Groups are
# informational only (all names are pooled into one allow-list). Names verified
# against NCU section definitions (SpeedOfLight / ComputeWorkloadAnalysis /
# MemoryWorkloadAnalysis / SchedulerStats / WarpStateStats / Occupancy /
# LaunchStats / InstructionStats) and this project's profiling runs.
#
# NOTE: exact availability is GPU/arch-dependent; on a given board NCU will
# report any unavailable counter. Prefer `.avg.pct_of_peak_sustained_active`
# (during active cycles) for utilization, `_elapsed` for occupancy-aware SOL.
# Pointed to by config/npt.yaml -> `metric_catalog:`.
# =============================================================================
catalog:
  # ── Speed Of Light (top-level roofline throughputs) ──────────────────────
  speed_of_light:
    - sm__throughput.avg.pct_of_peak_sustained_elapsed
    - sm__cycles_active.avg.pct_of_peak_sustained_elapsed
    - gpu__compute_memory_throughput.avg.pct_of_peak_sustained_elapsed
    - gpu__dram_throughput.avg.pct_of_peak_sustained_elapsed
    - dram__throughput.avg.pct_of_peak_sustained_elapsed
    - lts__throughput.avg.pct_of_peak_sustained_elapsed
    - l1tex__throughput.avg.pct_of_peak_sustained_elapsed

  # ── Compute Workload Analysis (pipe utilization) ─────────────────────────
  # Cycle-based pipe metrics are preferred over the older inst_executed ones.
  compute:
    - sm__pipe_tensor_cycles_active.avg.pct_of_peak_sustained_active
    - sm__pipe_tensor_op_hmma_cycles_active.avg.pct_of_peak_sustained_active
    - sm__pipe_fma_cycles_active.avg.pct_of_peak_sustained_active
    - sm__pipe_alu_cycles_active.avg.pct_of_peak_sustained_active
    - sm__pipe_fp64_cycles_active.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_alu.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_fma.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_fp16.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_fp64.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_lsu.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_xu.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_adu.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_cbu.avg.pct_of_peak_sustained_active
    - sm__inst_executed_pipe_tensor.avg.pct_of_peak_sustained_active

  # ── Instruction Statistics (issue / execution volume) ────────────────────
  instruction:
    - smsp__issue_active.avg.pct_of_peak_sustained_active
    - smsp__inst_executed.avg.pct_of_peak_sustained_active
    - sm__inst_executed.sum
    - smsp__inst_executed.sum
    - smsp__thread_inst_executed_per_inst_executed.ratio
    - smsp__sass_average_branch_targets_threads_uniform.pct

  # ── Memory Workload Analysis (DRAM / L2 / L1 / coalescing) ───────────────
  memory:
    - dram__bytes.sum
    - dram__bytes.sum.per_second
    - dram__bytes_read.sum
    - dram__bytes_write.sum
    - lts__t_sector_hit_rate.pct
    - l1tex__t_sector_hit_rate.pct
    - l1tex__t_sectors_pipe_lsu_mem_global_op_ld.sum
    - l1tex__t_sectors_pipe_lsu_mem_global_op_st.sum
    - l1tex__t_requests_pipe_lsu_mem_global_op_ld.sum
    - l1tex__t_requests_pipe_lsu_mem_global_op_st.sum
    - l1tex__data_bank_conflicts_pipe_lsu.sum
    - l1tex__data_bank_reads.avg.pct_of_peak_sustained_elapsed
    - l1tex__data_bank_writes.avg.pct_of_peak_sustained_elapsed
    - smsp__sass_average_data_bytes_per_sector_mem_global_op_ld.pct
    - smsp__sass_average_data_bytes_per_sector_mem_global_op_st.pct

  # ── Scheduler & Warp State Statistics (stall reasons) ────────────────────
  scheduler_warp_state:
    - sm__warps_active.avg.pct_of_peak_sustained_active
    - smsp__warps_active.avg.pct_of_peak_sustained_active
    - smsp__warps_eligible.avg.per_cycle_active
    - smsp__warp_issue_stalled_long_scoreboard_per_warp_active.pct
    - smsp__warp_issue_stalled_short_scoreboard_per_warp_active.pct
    - smsp__warp_issue_stalled_memory_dependency_per_warp_active.pct
    - smsp__warp_issue_stalled_barrier_per_warp_active.pct
    - smsp__warp_issue_stalled_not_selected_per_warp_active.pct
    - smsp__warp_issue_stalled_branch_resolving_per_warp_active.pct
    - smsp__warp_issue_stalled_wait_per_warp_active.pct
    - smsp__warp_issue_stalled_drain_per_warp_active.pct
    - smsp__warp_issue_stalled_imc_miss_per_warp_active.pct

  # ── Occupancy & Launch Statistics ────────────────────────────────────────
  occupancy_launch:
    - launch__occupancy_limit_blocks
    - launch__occupancy_limit_registers
    - launch__occupancy_limit_shared_mem
    - launch__occupancy_limit_warps
    - launch__registers_per_thread
    - launch__shared_mem_per_block_static
    - launch__shared_mem_per_block_allocated
    - launch__block_size
    - launch__grid_size
    - launch__waves_per_multiprocessor

  # ── Timing ───────────────────────────────────────────────────────────────
  timing:
    - gpu__time_duration.sum
