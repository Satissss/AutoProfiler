# KernelMem: CudaForge's loop plus memory of what was already tried.
#
#   scripts/eval.sh configs/eval/kernelmem.yaml                      # the full run
#   scripts/eval.sh configs/eval/kernelmem.yaml --limit 3 --rounds 2 # a quick check first
name: kernelmem

benchmark: kernelbench
groups: [level1, level2, level3]

methods:
  kernelmem:
    # Swap in the learned tree to test whether per-kernel counters beat fixed ones:
    #   profiler:
    #     type: tree
    #     path: output/trees/autoprofiler.json
    profiler:
      type: ncu_fixed
      metric_set: kernelmem                 # CudaForge's 24 plus memory-system counters

llm:
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY

backend: k8s
rounds: 1             # optimization rounds per task; the seed is round 0
output: output/results
