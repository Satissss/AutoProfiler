# CudaForge: a CUDA coder with a Judge reading 24 fixed counters.
#
#   scripts/eval.sh configs/eval/cudaforge.yaml                      # the full run
#   scripts/eval.sh configs/eval/cudaforge.yaml --limit 3 --rounds 2 # a quick check first
name: cudaforge

benchmark: kernelbench
groups: [level1, level2, level3]

methods:
  cudaforge:
    # Swap in the learned tree to test whether per-kernel counters beat fixed ones:
    #   profiler:
    #     type: tree
    #     path: output/trees/autoprofiler.json
    profiler:
      type: ncu_fixed
      metric_set: cudaforge                 # 24 counters, the same for every kernel

llm:
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY

backend: k8s
rounds: 1             # optimization rounds per task; the seed is round 0
output: output/results
