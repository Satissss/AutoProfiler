# KernelAgent: Triton, roofline-guided, a small beam per round.
#
#   scripts/eval.sh configs/eval/kernelagent.yaml                      # the full run
#   scripts/eval.sh configs/eval/kernelagent.yaml --limit 3 --rounds 2 # a quick check first
name: kernelagent

benchmark: kernelbench
groups: [level1, level2, level3]

methods:
  kernelagent:
    seeder:
      type: llm_triton
      attempts: 4
      temperature: 0.2
    # Swap in the learned tree to ask whether per-kernel counters beat fixed ones:
    #   profiler:
    #     type: tree
    #     path: output/trees/autoprofiler.json
    profiler:
      type: ncu_fixed
      metric_set: roofline                  # 10 speed-of-light counters
    optimizer:
      type: judge_coder
      language: triton
      gpu: RTX-4090
      n_samples: 2                          # the beam
      temperature: 0.7

llm:
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY

backend: k8s
rounds: 1             # optimization rounds per task; the seed is round 0
output: output/results
