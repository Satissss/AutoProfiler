# AutoKernel: one focused edit a round, kept only if 1% faster.
#
#   scripts/eval.sh configs/eval/autokernel.yaml                      # the full run
#   scripts/eval.sh configs/eval/autokernel.yaml --limit 3 --rounds 2 # a quick check first
name: autokernel

benchmark: kernelbench
groups: [level1, level2, level3]

methods:
  autokernel:
    seeder:
      type: llm_triton
      attempts: 4
      temperature: 0.2
    # Swap in the learned tree to ask whether per-kernel counters beat fixed ones:
    #   profiler:
    #     type: tree
    #     path: output/trees/autoprofiler.json
    profiler:
      type: ncu_fixed
      metric_set: roofline
    optimizer:
      type: edit_loop                       # hypothesis -> one edit -> keep or revert
      language: triton
      temperature: 0.7

llm:
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY

backend: k8s
rounds: 1             # optimization rounds per task; the seed is round 0
output: output/results
